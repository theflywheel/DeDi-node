services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dedi
      POSTGRES_PASSWORD: dedi
      POSTGRES_DB: dedi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedi"]
      interval: 2s
      timeout: 2s
      retries: 15

  dedid:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEDI_DB_URL: postgres://dedi:dedi@postgres:5432/dedi?sslmode=disable
      DEDI_KEY_FILE: /keys/dedid.key
      DEDI_ORIGIN: dev.dedi.local/log
    volumes:
      - ./keys:/keys:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
